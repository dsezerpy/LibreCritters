{% load wagtailcore_tags wagtailimages_tags %}

<div class="bg-surface border border-stroke rounded-xl p-4 flex flex-col sm:flex-row gap-4 shadow-sm">
    {% if value.image %}
        <div class="w-full sm:w-36 sm:h-36 flex-shrink-0 bg-app rounded-lg overflow-hidden border border-stroke">
            {% image value.image max-400x400 class="w-full h-full object-cover" %}
        </div>
    {% endif %}
    <div class="flex-grow space-y-2">
        <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-panel border border-stroke text-brand">
                {{ value.trait_type_display }}
            </span>
            <h3 class="text-base font-bold text-white">
                {{ value.name }}
            </h3>
        </div>
        <div class="text-sm text-slate-300 leading-relaxed">
            {{ value.description|richtext }}
        </div>
    </div>
</div>
